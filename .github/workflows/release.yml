name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Keystore (if secret provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate and Prepare Output APK
        id: apk_locator
        run: |
          SIGNED_APK=$(find app/build/outputs/apk/release/ -name "*release*.apk" | head -n 1)
          if [ -z "$SIGNED_APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          FINAL_NAME="NoHead-${TAG_NAME}.apk"
          cp "$SIGNED_APK" "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "Built APK: $FINAL_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_locator.outputs.apk_path }}
          name: "No head Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

